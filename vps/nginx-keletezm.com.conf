# /etc/nginx/sites-available/keletezm.com
#
# Single-tenant Kelete POS at keletezm.com.
# Backend (Node on PM2, port 5301) serves /api/*.
# Nginx serves the React build directly from frontend/build/.
# SPA fallback: any unmatched non-/api path â†’ index.html (React Router).
#
# Apply:
#   sudo cp vps/nginx-keletezm.com.conf /etc/nginx/sites-available/keletezm.com
#   sudo nginx -t && sudo systemctl reload nginx

# â”€â”€ HTTP â†’ HTTPS redirect â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
server {
    listen 80;
    listen [::]:80;
    server_name keletezm.com www.keletezm.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# â”€â”€ Main HTTPS server block â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name keletezm.com www.keletezm.com;

    # SSL (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/keletezm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/keletezm.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Where the React build lives on the VPS
    root /var/www/kelete-pos-tenant/frontend/build;
    index index.html;

    client_max_body_size 50M;
    proxy_read_timeout    300s;
    proxy_connect_timeout 60s;
    proxy_send_timeout    300s;

    access_log /var/log/nginx/keletedistributionzm.access.log;
    error_log  /var/log/nginx/keletedistributionzm.error.log;

    # â”€â”€ API + uploads + admin â†’ Node backend on 5301 â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    location ~ ^/(api|uploads|admin) {
        proxy_pass         http://127.0.0.1:5301;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_cache_bypass $http_upgrade;
    }

    # â”€â”€ Static React build with SPA fallback â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
    location / {
        try_files $uri $uri/ /index.html;
    }
}
