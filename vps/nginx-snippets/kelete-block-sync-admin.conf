# Kelete — S1 stage 1 (security remediation).
#
# Refuse, at the edge, the sync endpoints that must never be reachable from the
# internet on the VPS. They have no authentication in routes/sync.js and can
# wipe a branch's data (wipe-tenant, factory-reset), reset the server's own sync
# identity (reset, configure), or expose LAN settings (lan-config, lan-status).
#
# Tills never call these on the VPS during normal sync. The one exception is a
# till's own Factory Reset, which also asks the VPS to wipe that branch; the
# till code already treats that call as optional ("offline or VPS down — local
# reset still succeeds"), so it now simply fails here, which is the intent.
#
# NOT blocked (tills depend on them; they are secured in S1 stage 2):
#   /api/sync/push, /api/sync/pull, /api/sync/master/*, register,
#   join-branch, license-status, verify-license, identity, trial-status,
#   verify-hq-passcode, current-status, status.
#
# USAGE: include this file inside EVERY `server { ... }` block that proxies to
# the Kelete backend (bare domain AND every branch sub-domain), ABOVE the
# `location ~ ^/(api|uploads|admin)` block — nginx uses the first regex
# location that matches, in file order.
#
#     include /etc/nginx/snippets/kelete-block-sync-admin.conf;
#
# Rollback: remove the include line, `nginx -t`, `systemctl reload nginx`.

# `~*` (case-insensitive) because Express routing is case-insensitive:
# /api/sync/WIPE-TENANT would otherwise slip past a case-sensitive match.
location ~* ^/api/sync/(wipe-tenant|factory-reset|clear-pending|force-resync|reset|configure|run-now|lan-config|lan-status)/?$ {
    return 403;
}
